name: Validate or activate NTA GTFS

on:
  workflow_dispatch:
    inputs:
      activate:
        description: 'Activate the validated feed after staging checks'
        required: true
        default: false
        type: boolean
      force:
        description: 'Force a full NTA ZIP download (recommended during acceptance)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: nta-gtfs-static-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_gpI4Uz43dqnMfkU0Ddh9Jw_8XrrEJjO
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run importer tests
        run: python -m unittest discover -s tests -v

      - name: Validate or activate official NTA GTFS
        id: importer
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GTFS_IMPORT_TOKEN: ${{ secrets.GTFS_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.activate }}" != "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi

          output="$(python import_gtfs.py "${args[@]}")"
          printf '%s\n' "$output"

          status="$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["status"])' <<<"$output")"
          version="$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("version", ""))' <<<"$output")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "${{ inputs.activate }}" == "true" ]]; then
            case "$status" in
              activated|activated_reconciled|unchanged) ;;
              *) echo "Activation run ended in unexpected status: $status" >&2; exit 1 ;;
            esac
          else
            [[ "$status" == "dry_run_ok" ]] || {
              echo "Dry-run did not complete staging validation: $status" >&2
              exit 1
            }
          fi

      - name: Post-activation health gate
        if: ${{ inputs.activate }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPECTED_VERSION: ${{ steps.importer.outputs.version }}
        run: |
          # Let both alternating channels collect after the feed switch.
          sleep 65
          python scripts/check_post_activation.py --retry-seconds 180 --poll-interval 20
