name: Ballina Move web validation (offline contracts)
on:
  push:
    paths:
      - "web/**"
      - "render.yaml"
      - ".dockerignore"
      - "scripts/deploy_live_gateway_render.py"
      - "routing/src/types.ts"
      - ".github/workflows/web-validation.yml"
  pull_request:
    paths:
      - "web/**"
      - "render.yaml"
      - ".dockerignore"
      - "scripts/deploy_live_gateway_render.py"
      - "routing/src/types.ts"
      - ".github/workflows/web-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test read-only gateway without external queries
        run: npm run test:gateway
      - name: Build browser application
        run: npm run build:standalone
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test navigation and map contracts on desktop and mobile
        run: npm test
      - name: Verify static preview boundary
        run: npm run test:preview
      - name: Build and verify unprivileged container without provider access
        working-directory: .
        run: |
          set -euo pipefail
          docker build -f web/Dockerfile -t ballina-live:ci .
          trap 'docker rm -f ballina-live-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name ballina-live-ci --network none --read-only --cap-drop ALL --security-opt no-new-privileges ballina-live:ci
          docker exec -i ballina-live-ci python - <<'PY'
          import os, time, urllib.request
          assert os.getuid() == 10001
          assert not os.access('/app/web', os.W_OK)
          deadline = time.monotonic() + 10
          while True:
              try:
                  response = urllib.request.urlopen('http://127.0.0.1:10000/', timeout=1)
                  break
              except OSError:
                  if time.monotonic() > deadline:
                      raise
                  time.sleep(.1)
          assert response.status == 200
          assert "connect-src 'self'" in response.headers['Content-Security-Policy']
          assert b'Ballina Move' in response.read()
          PY
