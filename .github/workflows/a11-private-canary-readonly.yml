name: A11 private canary read-only acceptance (zero Stadia calls)

# Explicitly manual; never runs on push, pull request, schedule or deployment.
on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: 'Run six authenticated read-only GET requests; NO paid walking requests'
        required: true
        type: choice
        options:
          - NO_DO_NOT_RUN
          - YES_SIX_GET_REQUESTS
        default: NO_DO_NOT_RUN

permissions:
  contents: read
concurrency:
  group: ballina-a11-private-readonly-acceptance
  cancel-in-progress: false
jobs:
  canary-readonly-acceptance:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_read_only == 'YES_SIX_GET_REQUESTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JWT gateway, token gate, health and active GTFS without paid calls
        env:
          BALLINA_SUPABASE_ANON_JWT: ${{ secrets.BALLINA_SUPABASE_ANON_JWT }}
          BALLINA_ROUTING_PREVIEW_TOKEN: ${{ secrets.BALLINA_ROUTING_PREVIEW_TOKEN }}
        run: node routing/scripts/a11_canary_readonly_acceptance.cjs
