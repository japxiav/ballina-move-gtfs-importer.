name: Validate or activate NTA GTFS

on:
  workflow_dispatch:
    inputs:
      activate:
        description: 'Activate the validated feed after staging checks'
        required: true
        default: false
        type: boolean
      force:
        description: 'Force a full NTA ZIP download (recommended during acceptance)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: nta-gtfs-static-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_gpI4Uz43dqnMfkU0Ddh9Jw_8XrrEJjO
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run importer tests
        run: python -m unittest discover -s tests -v

      - name: Validate or activate official NTA GTFS
        id: importer
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GTFS_IMPORT_TOKEN: ${{ secrets.GTFS_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.activate }}" != "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi

          output="$(python import_gtfs.py "${args[@]}")"
          printf '%s\n' "$output"

          status="$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["status"])' <<<"$output")"
          version="$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("version", ""))' <<<"$output")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "${{ inputs.activate }}" == "true" ]]; then
            case "$status" in
              activated|activated_reconciled|unchanged) ;;
              *) echo "Activation run ended in unexpected status: $status" >&2; exit 1 ;;
            esac
          else
            [[ "$status" == "dry_run_ok" ]] || {
              echo "Dry-run did not complete staging validation: $status" >&2
              exit 1
            }
          fi

      - name: Post-activation health gate
        if: ${{ inputs.activate }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPECTED_VERSION: ${{ steps.importer.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/") + "/functions/v1/transport-api"
          key = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          expected = os.environ.get("EXPECTED_VERSION", "")
          headers = {"apikey": key, "Accept": "application/json"}

          # Give v8 enough time for both alternating GTFS-RT channels to run.
          time.sleep(130)

          def get(params):
              url = base + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          health = get({"action": "health"})
          if health.get("status") != "ok":
              raise SystemExit(f"health_not_ok:{health}")

          active = health.get("active_feed") or {}
          if expected and active.get("version") != expected:
              raise SystemExit(
                  f"active_feed_mismatch:expected={expected}:actual={active.get('version')}"
              )

          runs = health.get("latest_runs") or []
          if len(runs) < 2 or any(r.get("status") != "ok" for r in runs[:2]):
              raise SystemExit(f"collector_not_healthy:{runs}")

          departures = get({"action": "departures", "limit": "5"})
          if not isinstance(departures.get("departures"), list):
              raise SystemExit("departure_api_invalid_response")

          print(json.dumps({
              "status": "post_activation_ok",
              "active_feed": active.get("version"),
              "collector_runs": runs[:2],
              "departure_count": len(departures.get("departures") or []),
          }, sort_keys=True))
          PY
